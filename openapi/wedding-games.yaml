openapi: 3.1.0
info:
  title: Wedding Games API
  description: >-
    API du socle applicatif pour l'application privee d'animations de mariage (evenement, participants, invitations,
    salon d'attente, exclusions).
  contact:
    name: Organisation du mariage
  version: v1
servers:
  - url: http://localhost:8080
    description: Generated server url
tags:
  - name: Intervenant - Retardataires
    description: Integration manuelle d'un retardataire dans une equipe compatible
  - name: Admin - Questions
    description: Configuration des questions d'une partie (reserve a l'administrateur)
  - name: Admin - Participants
    description: Gestion des participants (reserve a l'administrateur)
  - name: Jury - Finalistes
    description: Top 3 des reponses les plus votees (egalites incluses), transmis au jury
  - name: Intervenant - Selection Who Said It
    description: Tirage aleatoire d'une question acceptee pour le jeu
  - name: Admin - Personnages
    description: Catalogue de personnages (reserve a l'administrateur)
  - name: Who Said It - Propositions
    description: Proposition et modification de questions par les invites, tant que le salon reste ouvert
  - name: Admin - Exclusions
    description: Gestion des exclusions de matchmaking (reserve a l'administrateur)
  - name: Quiz
    description: 'Saisie d''equipe en direct: prise de main, transfert du controle, reponse synchronisee'
  - name: Intervenant - Questions
    description: Consultation, activation et fermeture d'une question
  - name: Admin - Parties
    description: Configuration des parties (reserve a l'administrateur)
  - name: Session
    description: Session courante (participant ou staff) portee par le cookie opaque
  - name: Vote
    description: Vote public sur les reponses acceptees d'une question, anonymise et sans auto-vote
  - name: Evenement
    description: Configuration publique de l'evenement
  - name: Intervenant - Moderation quiz
    description: Moderation des reponses avant projection, vote et jury
  - name: Authentification staff
    description: Connexion des membres de l'organisation (mot de passe BCrypt)
  - name: Intervenant - Salon
    description: Pilotage du salon d'attente (ouverture, fermeture, arrivees)
  - name: Intervenant - Moderation Who Said It
    description: Acceptation, refus et correction des questions proposees par les invites
  - name: Salon
    description: Heartbeat de presence du participant dans le salon d'attente
  - name: Intervenant - Parties
    description: Consultation et pilotage de la machine d'etat commune aux jeux
  - name: Equipe
    description: Decouverte du personnage assigne et du binome/trio, une fois le matchmaking effectue
  - name: Intervenant - Matchmaking
    description: Generation des equipes a partir des participants presents
  - name: Admin - Import participants
    description: Import CSV/Excel des participants avec previsualisation
  - name: Admin - Salon
    description: Consultation du salon d'attente
  - name: Invitations
    description: Resolution et confirmation d'une invitation par code de secours (QR perdu ou illisible)
  - name: Admin - Comptes staff
    description: Gestion des comptes et roles de l'organisation
  - name: Invitations
    description: Resolution et confirmation d'une invitation par jeton opaque
  - name: Intervenant - Scores
    description: Attribution des points aux equipes et calcul du podium
  - name: Admin - Evenement
    description: Configuration de l'evenement (theme, textes, informations des maries)
  - name: Admin - Invitations
    description: Generation et regeneration des invitations (reserve a l'administrateur)
paths:
  /who-said-it/questions/{id}:
    put:
      tags:
        - Who Said It - Propositions
      summary: Modifie une de mes questions, tant que le salon reste ouvert
      operationId: update
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhoSaidItQuestionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/WhoSaidItQuestionResponse'
  /staff/who-said-it/questions/{id}/content:
    put:
      tags:
        - Intervenant - Moderation Who Said It
      summary: Corrige le contenu (faute de frappe, texte illisible) sans changer le sens
      operationId: correct
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhoSaidItCorrectionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/WhoSaidItQuestionResponse'
  /staff/answers/{answerId}/content:
    put:
      tags:
        - Intervenant - Moderation quiz
      summary: Corrige le contenu (faute de frappe, texte illisible) sans changer le sens
      operationId: correct_1
      parameters:
        - name: answerId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnswerCorrectionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AnswerModerationResponse'
  /quiz/questions/{questionId}/answer:
    get:
      tags:
        - Quiz
      summary: Etat actuel de la reponse de mon equipe (poll pour suivre la saisie en direct)
      operationId: getMyTeamAnswer
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/QuizAnswerResponse'
    put:
      tags:
        - Quiz
      summary: Met a jour le contenu de la reponse (reserve a celui qui a la main)
      operationId: updateContent
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuizAnswerUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/QuizAnswerResponse'
  /admin/staff/{id}:
    get:
      tags:
        - Admin - Comptes staff
      operationId: get
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StaffAccountResponse'
    put:
      tags:
        - Admin - Comptes staff
      operationId: update_1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffAccountUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/StaffAccountResponse'
    delete:
      tags:
        - Admin - Comptes staff
      operationId: delete
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /admin/participants/{id}:
    get:
      tags:
        - Admin - Participants
      operationId: get_1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ParticipantResponse'
    put:
      tags:
        - Admin - Participants
      operationId: update_2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ParticipantResponse'
    delete:
      tags:
        - Admin - Participants
      operationId: delete_1
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /admin/events/{eventId}:
    get:
      tags:
        - Admin - Evenement
      summary: Configuration d'un evenement donne (usage multi-evenements)
      operationId: get_2
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventPublicConfigResponse'
    put:
      tags:
        - Admin - Evenement
      summary: Met a jour la configuration d'un evenement donne (usage multi-evenements)
      operationId: update_3
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventConfigUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventPublicConfigResponse'
  /admin/event:
    get:
      tags:
        - Admin - Evenement
      summary: Configuration de l'unique evenement de ce deploiement
      operationId: getCurrent
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventPublicConfigResponse'
    put:
      tags:
        - Admin - Evenement
      summary: Met a jour la configuration de l'unique evenement de ce deploiement
      operationId: updateCurrent
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventConfigUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/EventPublicConfigResponse'
  /admin/characters/{id}:
    get:
      tags:
        - Admin - Personnages
      operationId: get_3
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GameCharacterResponse'
    put:
      tags:
        - Admin - Personnages
      operationId: update_4
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GameCharacterUpdateRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GameCharacterResponse'
    delete:
      tags:
        - Admin - Personnages
      operationId: delete_2
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
  /who-said-it/questions:
    post:
      tags:
        - Who Said It - Propositions
      summary: Propose une nouvelle question (limite au nombre de questions par participant)
      operationId: propose
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WhoSaidItQuestionRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/WhoSaidItQuestionResponse'
  /vote/questions/{questionId}:
    post:
      tags:
        - Vote
      summary: Vote pour une reponse (jamais celle de sa propre equipe, une seule fois par question)
      operationId: vote
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VoteCastRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/VoteResponse'
  /staff/who-said-it/questions/{id}/reject:
    post:
      tags:
        - Intervenant - Moderation Who Said It
      summary: 'Refuse la question: jamais selectionnee pour le jeu'
      operationId: reject
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/WhoSaidItQuestionResponse'
  /staff/who-said-it/questions/{id}/accept:
    post:
      tags:
        - Intervenant - Moderation Who Said It
      summary: 'Accepte la question: eligible a la selection aleatoire pour le jeu'
      operationId: accept
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/WhoSaidItQuestionResponse'
  /staff/questions/{questionId}/teams/{teamId}/relaunch:
    post:
      tags:
        - Intervenant - Moderation quiz
      summary: 'Relance une equipe: reponse remise a vide, plus personne n''a la main'
      operationId: relaunchTeam
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/AnswerModerationResponse'
  /staff/questions/{questionId}/close:
    post:
      tags:
        - Intervenant - Questions
      summary: 'Ferme la question (ACTIVE -> CLOSED): plus aucune modification de reponse n''est acceptee'
      operationId: close
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/QuestionResponse'
  /staff/questions/{questionId}/activate:
    post:
      tags:
        - Intervenant - Questions
      summary: 'Active la question (PENDING -> ACTIVE): les equipes peuvent desormais y repondre'
      operationId: activate
      parameters:
        - name: questionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/QuestionResponse'
  /staff/games/{gameId}/start:
    post:
      tags:
        - Intervenant - Parties
      summary: Demarre la partie (statut ACTIVE, phase PREPARATION)
      operationId: start
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GameResponse'
  /staff/games/{gameId}/resume:
    post:
      tags:
        - Intervenant - Parties
      summary: Reprend une partie en pause, sur la meme phase
      operationId: resume
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GameResponse'
  /staff/games/{gameId}/pause:
    post:
      tags:
        - Intervenant - Parties
      summary: Met la partie en pause, sans changer la phase en cours
      operationId: pause
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GameResponse'
  /staff/games/{gameId}/next-question:
    post:
      tags:
        - Intervenant - Parties
      summary: Passe a la question suivante (phase QUESTION), depuis PREPARATION ou RESULT
      operationId: nextQuestion
      parameters:
        - name: gameId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/GameResponse'
  /staff/events/{eventId}/who-said-it/questions/select-random:
    post:
      tags:
        - Intervenant - Selection Who Said It
      summary: Tire au hasard une question acceptee et la fait passer a jouee
      description: >-
        Echoue explicitement (409) si aucune question acceptee n'est disponible. Le prenom de l'auteur n'est renvoye que
        s'il a consenti a etre revele: c'est le moment ou ce consentement compte le plus, contrairement a la moderation
        ou le staff voit toujours qui a propose quoi.
      operationId: selectRandom
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/WhoSaidItQuestionResponse'
  /staff/events/{eventId}/scores:
    get:
      tags:
        - Intervenant - Scores
      summary: Liste le journal des points attribues pour l'evenement
      operationId: list
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ScoreResponse'
    post:
      tags:
        - Intervenant - Scores
      summary: Attribue (ou retire) des points a une equipe; le bareme est fourni par l'appelant
      operationId: award
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreAwardRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ScoreResponse'
  /staff/events/{eventId}/matchmaking/launch:
    post:
      tags:
        - Intervenant - Matchmaking
      summary: Genere les equipes a partir des participants presents dans le salon
      description: >-
        Peut etre relance a volonte: les equipes precedentes sont remplacees. Echoue explicitement (409) si aucune
        repartition ne respecte les exclusions absolues.
      operationId: launch
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamResponse'
  /staff/events/{eventId}/matchmaking/latecomers/{participantId}/pair-with/{otherParticipantId}:
    post:
      tags:
        - Intervenant - Retardataires
      summary: Forme un nouveau binome entre deux retardataires
      operationId: pairWith
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: otherParticipantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TeamResponse'
  /staff/events/{eventId}/matchmaking/latecomers/{participantId}/join-team/{teamId}:
    post:
      tags:
        - Intervenant - Retardataires
      summary: Integre le retardataire dans un binome existant, qui devient un trio
      operationId: joinTeam
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: teamId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/TeamResponse'
  /staff/events/{eventId}/lobby/start:
    post:
      tags:
        - Intervenant - Salon
      operationId: start_1
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LobbyResponse'
  /staff/events/{eventId}/lobby/resume:
    post:
      tags:
        - Intervenant - Salon
      operationId: resume_1
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LobbyResponse'
  /staff/events/{eventId}/lobby/pause:
    post:
      tags:
        - Intervenant - Salon
      operationId: pause_1
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LobbyResponse'
  /staff/events/{eventId}/lobby/participants/{participantId}/late:
    post:
      tags:
        - Intervenant - Salon
      operationId: markLate
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LobbyParticipantResponse'
  /staff/events/{eventId}/lobby/participants/{participantId}/admit:
    post:
      tags:
        - Intervenant - Salon
      operationId: admit
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: participantId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LobbyParticipantResponse'
  /staff/events/{eventId}/lobby/open:
    post:
      tags:
        - Intervenant - Salon
      operationId: open
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LobbyResponse'
  /staff/events/{eventId}/lobby/lock:
    post:
      tags:
        - Intervenant - Salon
      operationId: lock
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LobbyResponse'
  /staff/events/{eventId}/lobby/finish:
    post:
      tags:
        - Intervenant - Salon
      operationId: finish
      parameters:
        - name: eventId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/LobbyResponse'
  /staff/events/{eventId}/lobby/close:
    post:
      tags:
