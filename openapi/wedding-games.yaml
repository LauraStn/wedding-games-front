openapi: 3.1.0
info:
  title: Wedding Games API (contrat provisoire)
  version: 0.1.0-draft
  description: >
    Contrat OpenAPI provisoire, écrit côté frontend en l'absence du contrat
    officiel exposé par le backend Spring Boot (dépôt games-app-back, vide au
    moment de la rédaction). Il couvre uniquement le périmètre de la phase 1 :
    navigation, identification par QR/code, salon, administration, pilotage
    intervenant, jury et écran de projection. À REMPLACER par le contrat
    généré par le backend dès qu'il sera disponible (voir README, section
    "Génération du client OpenAPI").
servers:
  - url: /api/v1

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: WEDDING_SESSION

  schemas:
    Role:
      type: string
      enum: [ADMIN, INTERVENANT, JURY, PARTICIPANT, PROJECTION]

    ProblemDetail:
      type: object
      required: [code, message, status]
      properties:
        code:
          type: string
          description: Code d'erreur métier stable (ex. INVALID_CREDENTIALS)
        message:
          type: string
        status:
          type: integer
        path:
          type: string
        timestamp:
          type: string
          format: date-time
        details:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              message:
                type: string

    StaffAccountResponse:
      type: object
      required: [id, username, displayName, role, active, createdAt]
      properties:
        id:
          type: string
        username:
          type: string
        displayName:
          type: string
        role:
          $ref: '#/components/schemas/Role'
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time

    StaffLoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string

    ParticipantSessionResponse:
      type: object
      required: [participantId, eventId, eventSlug, firstName, displayName, status, totalPoints, totalWins]
      properties:
        participantId:
          type: string
        eventId:
          type: string
        eventSlug:
          type: string
        firstName:
          type: string
        displayName:
          type: string
        status:
          type: string
        totalPoints:
          type: integer
        totalWins:
          type: integer

    InvitationResolveResponse:
      type: object
      required: [participantId, firstName, displayName, eventSlug, eventTitle]
      properties:
        participantId:
          type: string
        firstName:
          type: string
        displayName:
          type: string
        eventSlug:
          type: string
        eventTitle:
          type: string

    EventTheme:
      type: object
      required: [eventTitle, spouseNames, eventDate, colors]
      properties:
        eventTitle:
          type: string
        spouseNames:
          type: array
          items:
            type: string
          minItems: 2
          maxItems: 2
        eventDate:
          type: string
          format: date
        logoUrl:
          type: string
          nullable: true
        welcomeText:
          type: string
          nullable: true
        colors:
          type: object
          required: [primary, secondary, background, accent]
          properties:
            primary:
              type: string
            secondary:
              type: string
            background:
              type: string
            accent:
              type: string

    InvitationPreview:
      type: object
      required: [firstName, lastName, status]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        status:
          type: string
          enum: [VALID, REVOKED, ALREADY_USED, EXPIRED]

    Session:
      type: object
      required: [actorType, role]
      properties:
        actorType:
          type: string
          enum: [PARTICIPANT, STAFF]
        role:
          $ref: '#/components/schemas/Role'
        participant:
          allOf:
            - $ref: '#/components/schemas/ParticipantSessionResponse'
          nullable: true
        staff:
          allOf:
            - $ref: '#/components/schemas/StaffAccountResponse'
          nullable: true

    LobbyState:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [CLOSED, OPEN, LOCKED]
        connectedCount:
          type: integer
          nullable: true
        message:
          type: string
          nullable: true

    ScreenState:
      type: object
      required: [theme, lobby]
      properties:
        theme:
          $ref: '#/components/schemas/EventTheme'
        lobby:
          $ref: '#/components/schemas/LobbyState'

    Participant:
      type: object
      required: [id, firstName, lastName, active, role, invitationStatus]
      properties:
        id:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        active:
          type: boolean
        role:
          $ref: '#/components/schemas/Role'
        invitationStatus:
          type: string
          enum: [NOT_GENERATED, VALID, REVOKED, ALREADY_USED, EXPIRED]

    ParticipantInput:
      type: object
      required: [firstName, lastName]
      properties:
        firstName:
          type: string
        lastName:
          type: string
        role:
          $ref: '#/components/schemas/Role'

    Invitation:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [NOT_GENERATED, VALID, REVOKED, ALREADY_USED, EXPIRED]
        qrAvailable:
          type: boolean

    Exclusion:
      type: object
      required: [id, participantAId, participantBId, type]
      properties:
        id:
          type: string
        participantAId:
          type: string
        participantBId:
          type: string
        type:
          type: string
          enum: [ABSOLUTE, PREFERENCE]
        reason:
          type: string
          nullable: true

    ExclusionInput:
      type: object
      required: [participantAId, participantBId, type]
      properties:
        participantAId:
          type: string
        participantBId:
          type: string
        type:
          type: string
          enum: [ABSOLUTE, PREFERENCE]
        reason:
          type: string
          nullable: true

    Arrival:
      type: object
      required: [participantId, firstName, lastName, arrivedAt, late]
      properties:
        participantId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        arrivedAt:
          type: string
          format: date-time
        late:
          type: boolean

    EventAdminConfig:
      type: object
      required: [id, slug, title, language, status, visualConfig]
      properties:
        id:
          type: string
        slug:
          type: string
        title:
          type: string
        language:
          type: string
        status:
          type: string
          enum: [DRAFT, OPEN, LIVE, CLOSED]
        spouseOneName:
          type: string
          nullable: true
        spouseTwoName:
          type: string
          nullable: true
        eventDate:
          type: string
          format: date
          nullable: true
        venueName:
          type: string
          nullable: true
        welcomeMessage:
          type: string
          nullable: true
        visualConfig:
          type: object
          additionalProperties: true

    EventAdminConfigInput:
      type: object
      required: [title]
      properties:
        title:
          type: string
        spouseOneName:
          type: string
          nullable: true
        spouseTwoName:
          type: string
          nullable: true
        eventDate:
          type: string
          format: date
          nullable: true
        venueName:
          type: string
          nullable: true
        welcomeMessage:
          type: string
          nullable: true
        visualConfig:
          type: object
          additionalProperties: true
          nullable: true

paths:
  /theme:
    get:
      operationId: getTheme
      summary: Configuration visuelle et textuelle de l'événement
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTheme'

  /invitations/{token}/resolve:
    get:
      operationId: resolveInvitation
      summary: Résout un jeton d'invitation (issu du QR personnel), sans ouvrir de session
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Invitation résolue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationResolveResponse'
        '404':
          description: Jeton inconnu ou révoqué
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /invitations/{token}/confirm:
    post:
      operationId: confirmInvitation
      summary: Confirme l'identité et ouvre la session participant
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Session créée (cookie posé par le backend)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '404':
          description: Jeton inconnu ou révoqué
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /invitations/confirm:
    post:
      operationId: confirmInvitationByCode
      summary: >
        (Provisoire, non supporté par le backend) Confirme l'identité à
        partir d'un code de secours résolu via /invitations/fallback. Conservé
        tel quel en attendant une décision produit — voir le plan
        "Réaligner l'auth sur le vrai backend".
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                code:
                  type: string
      responses:
        '200':
          description: Session créée (cookie posé par le backend)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '410':
          description: Jeton devenu invalide entre la résolution et la confirmation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /invitations/fallback:
    post:
      operationId: resolveFallbackCode
      summary: Résout un code d'invitation de secours saisi manuellement
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
      responses:
        '200':
          description: Invitation résolue
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationPreview'
        '404':
          description: Code inconnu
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /session/me:
    get:
      operationId: getSession
      summary: Session active (restauration après rechargement)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: Session active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          description: Aucune session active
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /session/logout:
    post:
      operationId: closeSession
      summary: Ferme la session courante (idempotent)
      security: [{ cookieAuth: [] }]
      responses:
        '204':
          description: Session fermée

  /auth/staff/login:
    post:
      operationId: staffLogin
      summary: Authentifie un membre du staff et pose le cookie de session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StaffLoginRequest'
      responses:
        '200':
          description: Connecté (cookie posé par le backend)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StaffAccountResponse'
        '401':
          description: Identifiants invalides ou compte désactivé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'
        '400':
          description: Requête invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /lobby:
    get:
      operationId: getLobby
      summary: État du salon (participant)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyState'

  /screen/state:
    get:
      operationId: getScreenState
      summary: État public destiné à l'écran de projection
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScreenState'

  /admin/participants:
    get:
      operationId: listParticipants
      summary: Liste et recherche des participants
      security: [{ cookieAuth: [] }]
      parameters:
        - name: search
          in: query
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Participant'
    post:
      operationId: createParticipant
      summary: Ajoute un participant
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantInput'
      responses:
        '201':
          description: Créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'

  /admin/participants/{id}:
    patch:
      operationId: updateParticipant
      summary: Modifie un participant
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParticipantInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'

  /admin/participants/{id}/disable:
    post:
      operationId: disableParticipant
      summary: Désactive un participant
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Participant'

  /admin/participants/{id}/invitation:
    get:
      operationId: getParticipantInvitation
      summary: Statut de l'invitation d'un participant
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'

  /admin/participants/{id}/invitation/generate:
    post:
      operationId: generateParticipantInvitation
      summary: Génère l'invitation d'un participant
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'

  /admin/participants/{id}/invitation/regenerate:
    post:
      operationId: regenerateParticipantInvitation
      summary: Régénère l'invitation d'un participant (invalide l'ancien jeton)
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'

  /admin/participants/{id}/invitation/qr:
    get:
      operationId: getParticipantInvitationQr
      summary: Image QR de l'invitation (si disponible)
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Image PNG du QR
          content:
            image/png:
              schema:
                type: string
                format: binary
        '404':
          description: QR non disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /admin/exclusions:
    get:
      operationId: listExclusions
      summary: Liste des exclusions
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Exclusion'
    post:
      operationId: createExclusion
      summary: Crée une exclusion
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExclusionInput'
      responses:
        '201':
          description: Créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exclusion'

  /admin/exclusions/{id}:
    delete:
      operationId: deleteExclusion
      summary: Supprime une exclusion (les exclusions absolues sont protégées côté backend)
      security: [{ cookieAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Supprimée
        '403':
          description: Suppression interdite (exclusion absolue)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /admin/event:
    get:
      operationId: getEventConfig
      summary: Configuration complète de l'événement (organisateur)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAdminConfig'
    put:
      operationId: updateEventConfig
      summary: Met à jour la configuration de l'événement (thème, textes, informations des mariés)
      security: [{ cookieAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventAdminConfigInput'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventAdminConfig'
        '400':
          description: Requête invalide
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProblemDetail'

  /admin/staff:
    get:
      operationId: listStaffAccounts
      summary: Comptes staff et leur rôle
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/StaffAccountResponse'

  /admin/lobby:
    get:
      operationId: getAdminLobby
      summary: État détaillé du salon (vue administrateur)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyState'

  /intervenant/lobby:
    get:
      operationId: getIntervenantLobby
      summary: État du salon (vue intervenant)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyState'

  /intervenant/lobby/open:
    post:
      operationId: openLobby
      summary: Ouvre le salon
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyState'

  /intervenant/lobby/close:
    post:
      operationId: closeLobby
      summary: Ferme le salon
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyState'

  /intervenant/lobby/lock:
    post:
      operationId: lockLobby
      summary: Verrouille le salon
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LobbyState'

  /intervenant/arrivals/recent:
    get:
      operationId: listRecentArrivals
      summary: Dernières arrivées
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Arrival'

  /intervenant/arrivals/late:
    get:
      operationId: listLateArrivals
      summary: Invités arrivés en retard (non encore enregistrés)
      security: [{ cookieAuth: [] }]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [firstName, lastName]
                  properties:
                    firstName:
                      type: string
                    lastName:
                      type: string
